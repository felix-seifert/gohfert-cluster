name: Renovate

on:
  schedule:
    # Every Monday and Thursday at 7 AM UTC
    - cron: '0 7 * * 1,4'
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Get token
        id: get_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          private-key: ${{ secrets.GOHFERT_RENOVATOR_APP_PRIVATE_KEY }}
          client-id: ${{ secrets.GOHFERT_RENOVATOR_APP_ID }}
          owner: ${{ github.repository_owner }}
          repositories: 'gohfert-cluster'

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@1a96852b0384df1837619d04c60b2d10d1f9ff08 # v46.1.21
        with:
          configurationFile: renovator.json
          token: ${{ steps.get_token.outputs.token }}
        env:
          RENOVATE_PLATFORM_COMMIT: 'enabled'
          RENOVATE_REPOSITORIES: 'felix-seifert/gohfert-cluster'
