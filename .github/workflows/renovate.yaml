name: Renovate

on:
  schedule:
    # Every Monday and Thursday at 7 AM UTC
    - cron: '0 7 * * 1,4'
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Get token
        id: get_token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          private-key: ${{ secrets.GOHFERT_RENOVATOR_APP_PRIVATE_KEY }}
          client-id: ${{ secrets.GOHFERT_RENOVATOR_APP_ID }}
          owner: ${{ github.repository_owner }}
          repositories: 'gohfert-cluster'

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          configurationFile: renovator.json
          token: ${{ steps.get_token.outputs.token }}
        env:
          RENOVATE_PLATFORM_COMMIT: 'enabled'
          RENOVATE_REPOSITORIES: 'felix-seifert/gohfert-cluster'
